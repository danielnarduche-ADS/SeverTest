<!DOCTYPE html>
<html lang="pt-BR"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container">
        <h2>login</h2>
        <p class="subtitle">key your data</p>
        
        <form hx-post="/login/verify">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" >
            </div>

            <div class="form-group">
                <label for="password">password</label>
                <input type="password" id="password" name="password" placeholder="minimun 8 character" required="">
            </div>
            <p id="ErrorMsg" class="errorbox"></p>

            <button type="submit" class="btn-submit">Registrar</button>
        </form>

        <p class="footer-text">
            Don't have account <a href="#">sign-up</a>
        </p>
    </div>

    <script src="assets/vendor/htmx.min.js"></script>
    <script src="assets/vendor/htmx-config.js"></script>
</body>
</html>
